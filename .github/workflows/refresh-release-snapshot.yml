name: Refresh release snapshot

# The published verification snapshot carries a 72 hour freshness window
# (publish-cli.ts --max-age-hours). Hireability depends on that window:
# determineHireability only returns canHire when verification.freshness is
# "current", so an expired snapshot silently removes every Hire action from the
# site without anyone touching the code.
#
# Vercel regenerates the snapshot on every build (vercel.json buildCommand runs
# build:deployment), so the invariant is simply that a build must happen more
# often than the freshness window. This schedule guarantees it.
#
# tests/submission-plan.test.ts asserts that this interval stays inside the
# window; widening one without the other fails CI.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger a production rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; the snapshot will expire." >&2
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' -X POST "$DEPLOY_HOOK_URL")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Deploy hook returned $status" >&2
            exit 1
          fi
          echo "Requested a production rebuild; the snapshot is regenerated by build:deployment."

  verify-served-freshness:
    needs: redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: https://bnb-agent-marketplace-ruby.vercel.app
    steps:
      - name: Wait for the rebuild to propagate
        run: sleep 180
      - name: Confirm the served catalogue still exposes a hireable seller
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --max-time 25 "$ORIGIN/agents?view=marketplace")"
          if ! printf '%s' "$body" | grep -q "Hire agent"; then
            echo "The served marketplace catalogue exposes no Hire action." >&2
            echo "The release snapshot is most likely stale: hireability requires current verification." >&2
            exit 1
          fi
          echo "Served catalogue still exposes a Hire action."
