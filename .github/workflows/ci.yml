name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cli

  observation-worker:
    runs-on: ubuntu-latest
    # Full D1 coverage takes ~8 minutes locally; a shared CI runner exceeded
    # 25 minutes while simulations were still progressing. Keep every test
    # and economic threshold; allow enough wall-clock time to finish.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: bnb-agent-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bnb-agent-probe/package-lock.json
      # Worker imports shared source from ../src; resolve its root dependencies too.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run check
