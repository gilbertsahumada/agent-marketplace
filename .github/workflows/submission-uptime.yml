name: Submission uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORIGIN: https://bnb-agent-marketplace-ruby.vercel.app
      MAINNET_UPTIME_BUYER_ADDRESS: ${{ vars.MAINNET_UPTIME_BUYER_ADDRESS }}
    steps:
      - name: Check durable public routes
        run: |
          set -euo pipefail
          check_200() {
            route="$1"
            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$ORIGIN$route")"
            if [ "$status" != "200" ]; then
              echo "Expected anonymous 200 for $route, received $status" >&2
              exit 1
            fi
          }
          check_200 "/"
          check_200 "/agents?view=marketplace"
          check_200 "/agents/45650"
          check_200 "/hire/45650"
          check_200 "/jobs/testnet/551"
          check_200 "/evidence/verification"
      - name: Check the served catalogue still exposes a hireable seller
        run: |
          set -euo pipefail
          # A 200 only proves something is deployed. Hireability additionally
          # requires the release snapshot to be inside its freshness window, so
          # this asserts the rendered affordance rather than the status code.
          body="$(curl --silent --show-error --max-time 25 "$ORIGIN/agents?view=marketplace")"
          if ! printf '%s' "$body" | grep -q "Hire agent"; then
            echo "The served marketplace catalogue exposes no Hire action." >&2
            echo "Most likely the release verification snapshot expired; run publish:verification and redeploy." >&2
            exit 1
          fi
      - name: Check Mainnet Grid seller when current qualification exposes it
        run: |
          set -euo pipefail
          proof_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$ORIGIN/proof/mainnet")"
          if [ "$proof_status" != "200" ] && [ "$proof_status" != "404" ]; then
            echo "Expected Mainnet proof to return 200 or 404, received $proof_status" >&2
            exit 1
          fi
          quote_file="$(mktemp)"
          prepare_file="$(mktemp)"
          trap 'rm -f "$quote_file" "$prepare_file"' EXIT
          quote_status="$(curl --silent --show-error --max-time 30 --request POST --output "$quote_file" --write-out '%{http_code}' "$ORIGIN/api/marketplace/demo/erc8183-mainnet/quote")"
          if [ "$quote_status" = "404" ]; then
            if [ "$proof_status" = "200" ]; then
              echo "Mainnet proof is published but the qualified hiring route is unavailable" >&2
              exit 1
            fi
            echo "Mainnet hiring is not exposed: no current qualified and configured seller."
            exit 0
          fi
          if [ "$quote_status" != "200" ]; then
            echo "Expected Mainnet quote to return 200 or 404, received $quote_status" >&2
            exit 1
          fi

          test -n "$MAINNET_UPTIME_BUYER_ADDRESS" || {
            echo "MAINNET_UPTIME_BUYER_ADDRESS is required after Mainnet hiring is exposed" >&2
            exit 1
          }
          curl --fail --silent --show-error --max-time 20 "$ORIGIN/demo/erc8183-mainnet" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$ORIGIN/grid/.well-known/agent-card.json" >/dev/null
          jq --exit-status '.chainId == 56 and (.envelope | type == "object")' "$quote_file" >/dev/null
          jq --arg buyer "$MAINNET_UPTIME_BUYER_ADDRESS" '{buyer: $buyer, quote: .envelope}' "$quote_file" >"$prepare_file"
          curl --fail --silent --show-error --max-time 30 --request POST \
            --header 'content-type: application/json' --data-binary @"$prepare_file" \
            "$ORIGIN/api/marketplace/demo/erc8183-mainnet/prepare" >/dev/null
